name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rota:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          ROTA_SECRET: smoke-test-secret-not-used-anywhere
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 -e ROTA_SECRET="$ROTA_SECRET" rota:smoke

          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && break
            sleep 1
          done

          echo "::group::container log"
          docker logs smoke
          echo "::endgroup::"

          curl -fsS http://127.0.0.1:3000/ >/dev/null
          curl -fsS http://127.0.0.1:3000/openapi.json >/dev/null
          echo "docs and schema served"

          minted=$(curl -fsS -X POST http://127.0.0.1:3000/api/schedule \
            -H 'Content-Type: application/json' \
            -d '{"routines":["Push","Pull","Legs"],"slots":["mon@18:00","thu@19:30"],
                 "start":"2026-09-14","tz":"Europe/Amsterdam","name":"CI"}')
          jq -e '.eventCount == 6 and .periodWeeks == 3' <<<"$minted" >/dev/null \
            || { echo "unexpected rotation: $minted"; exit 1; }
          echo "schedule minted and signed"

          curl -fsS "$(jq -r .feedUrl <<<"$minted")" | grep -q '^BEGIN:VCALENDAR' \
            || { echo "feed is not an iCalendar document"; exit 1; }
          echo "feed subscribes"

          start=$(date +%s)
          docker stop smoke >/dev/null
          elapsed=$(( $(date +%s) - start ))
          code=$(docker inspect smoke --format '{{.State.ExitCode}}')
          echo "stopped in ${elapsed}s with exit ${code}"
          [ "$elapsed" -lt 5 ] && [ "$code" = "0" ] \
            || { echo "did not shut down gracefully"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
